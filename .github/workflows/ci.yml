name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build
        run: npm run build

      - name: ✅ Verify security (no hardcoded secrets)
        run: |
          # Scan source files for common secret patterns
          if grep -rnE "sk-[A-Za-z0-9]{20,}|[a-f0-9]{32}\.[A-Za-z0-9]{16}|tp-sk[a-z0-9]{20,}" \
              --include="*.ts" --include="*.js" --include="*.md" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "❌ Hardcoded secrets detected!"
            git diff --stat || true
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '22.x'
        with:
          name: dist
          path: dist/
          retention-days: 7
