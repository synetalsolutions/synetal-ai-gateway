version: "3.8"

services:
  synetal-gateway:
    build: .
    container_name: synetal-gateway
    ports:
      - "3456:3456"
    environment:
      - PROXY_PORT=3456
      - PROXY_API_KEY=${PROXY_API_KEY:-REDACTED-PROXY-KEY}
      - DEFAULT_PROVIDER=kimi
      - FALLBACK_CHAIN=glm,deepseek,xiaomi,kimi
      - MAX_RETRIES=2
      - RETRY_DELAY_MS=500
      # Add your API keys below or use .env file
      - KIMI_API_KEY=${KIMI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GLM_API_KEY=${GLM_API_KEY}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY}
    restart: unless-stopped
