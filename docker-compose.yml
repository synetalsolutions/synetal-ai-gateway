# Kestrel AI Gateway — Docker Compose
# Usage:
#   1. Copy .env.example to .env and fill in your keys
#   2. Generate a secure PROXY_API_KEY: openssl rand -hex 32
#   3. docker-compose up -d

version: "3.8"

services:
  kestrel-gateway:
    build: .
    container_name: kestrel-gateway
    ports:
      - "3456:3456"
    environment:
      - PROXY_PORT=3456
      # Generate your own key with: openssl rand -hex 32
      - PROXY_API_KEY=${PROXY_API_KEY:?Set PROXY_API_KEY in your .env file}
      - DEFAULT_PROVIDER=kimi
      - FALLBACK_CHAIN=glm,deepseek,xiaomi,kimi
      - MAX_RETRIES=2
      - RETRY_DELAY_MS=500
      # Add your API keys below or use .env file
      - KIMI_API_KEY=${KIMI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GLM_API_KEY=${GLM_API_KEY}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY}
    restart: unless-stopped
